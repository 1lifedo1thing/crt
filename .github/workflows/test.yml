        run: cargo test --workspace --lib --bins --tests ${{ runner.os == 'Linux' && '-- --skip visual_' || '' }}name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      # --workspace, or only the root package is tested: the member crates
      # (crt-core, crt-renderer, crt-theme, crt-update) hold well over half
      # the suite and were silently never run here.
      # --lib --bins --tests rather than --all-targets: the latter also runs
      # the criterion benches, which reject the --skip argument below.
      - name: Run tests
        run: cargo test --workspace --lib --bins --tests ${{ runner.os == 'Linux' && '-- --skip visual_' || '' }}

  visual-tests:
    # Visual/golden tests only run on macOS where golden images were generated
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run GPU tests
        # Fail instead of silently skipping when the runner has no GPU adapter.
        # Covers the golden-image tests and the headless per-pass buffer tests.
        env:
          CRT_REQUIRE_GPU: "1"
        run: cargo test --test visual_tests --test transient_render_tests

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-failures
          path: tests/visual/failures/
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Generate coverage report
        # --ignore-run-fail: visual tests may fail on Linux (golden images from macOS)
        run: cargo llvm-cov --workspace --all-targets --ignore-run-fail --lcov --output-path lcov.info

      - name: Print coverage summary
        run: cargo llvm-cov --workspace --all-targets --no-run

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
