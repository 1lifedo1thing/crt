name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          # Build Linux x86_64 on Ubuntu 22.04 to maximize glibc compatibility.
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libxkbcommon-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: ./scripts/release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crt-${{ matrix.os }}-${{ matrix.arch }}
          path: target/release/dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # SHA256SUMS is what the in-app updater fetches: it is both the version
      # discovery source and the integrity check (CRT-I-0034). The format is a
      # contract the app parses, so keep it exactly as coreutils writes it:
      #   - one line per asset: "<64 lowercase hex><two spaces><filename>"
      #   - filenames are bare (no path), "crt-<semver>-<os>-<arch>.tar.gz"
      #   - every entry carries the same <semver>
      # The app reads the version from these filenames, so a release whose
      # entries disagree on the version is rejected rather than guessed at.
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum crt-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS

  publish-aur:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: ./scripts/publish-aur.sh ${{ steps.version.outputs.version }}
